<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Invoice Extractor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&display=swap');

    :root {
      --white: #ffffff;
      --bg: #f9fafb;
      --border: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-tertiary: #9ca3af;
      --emerald-primary: #059669;
      --emerald-hover: #047857;
      --emerald-light: #ecfdf5;
      --emerald-border: #10b981;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 40px 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1400px; margin: 0 auto; }

    .header {
      text-align: center;
      margin: -40px -16px 50px;
      padding: 56px 24px 44px;
      background: var(--white);
      border-bottom: 1px solid var(--border);
    }

    .header .logo {
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      letter-spacing: 4px;
      color: var(--emerald-primary);
      text-transform: uppercase;
      margin-bottom: 14px;
      display: block;
      font-weight: 600;
    }

    .header h1 {
      font-family: 'Playfair Display', serif;
      font-variant: small-caps;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 700;
      color: var(--emerald-primary);
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .header .divider {
      width: 64px;
      height: 2px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, var(--emerald-border), transparent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.85fr;
      gap: 30px;
      align-items: start;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s ease;
    }

    .card:hover { box-shadow: var(--shadow-md); }

    .card-title {
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--text-tertiary);
      text-transform: uppercase;
      margin-bottom: 28px;
      display: block;
      font-weight: 700;
    }

    .upload-zone {
      border: 2px dashed var(--emerald-border);
      border-radius: 10px;
      padding: 60px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 35px;
      background: var(--emerald-light);
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      background: #d1fae5;
      border-color: var(--emerald-hover);
      transform: scale(1.01);
    }

    .upload-zone-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--emerald-hover);
      margin-bottom: 6px;
    }

    .upload-zone-hint {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    .form-group { display: flex; flex-direction: column; }
    .full-width { grid-column: 1 / -1; }

    .form-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      font-family: 'Sora', sans-serif;
    }

    input, select {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      border: 1px solid var(--emerald-border);
      border-radius: 8px;
      padding: 12px;
      outline: none;
      transition: all 0.2s ease;
      background: var(--white);
    }

    input:focus, select:focus {
      border-color: var(--emerald-hover);
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
    }

    input:disabled {
      background: #f3f4f6;
      border-color: var(--border);
      color: var(--text-tertiary);
      cursor: not-allowed;
    }

    .display-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--emerald-primary);
      padding: 10px 0;
      font-family: 'Sora', sans-serif;
    }

    .button-group {
      display: flex;
      gap: 16px;
      margin-top: 35px;
    }

    button {
      flex: 1;
      font-family: 'Sora', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 14px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      border: none;
    }

    .btn-primary {
      background: var(--emerald-primary);
      color: var(--white);
    }

    .btn-primary:hover {
      background: var(--emerald-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }

    .btn-secondary {
      background: var(--white);
      color: var(--emerald-primary);
      border: 2px solid var(--emerald-primary);
    }

    .btn-secondary:hover { background: var(--emerald-light); }

    .phone-badge {
      display: inline-flex;
      padding: 8px 14px;
      background: var(--emerald-light);
      border: 1px solid var(--emerald-border);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--emerald-hover);
      margin-bottom: 16px;
    }

    .preview-area {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.8;
      background: #fdfdfd;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      height: 440px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
      flex-direction: column;
    }

    .modal.active { display: flex; }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--white);
      border-top-color: var(--emerald-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 1024px) {
      .main-grid { grid-template-columns: 1fr; }
      .card { padding: 30px; }
    }


    /* Smartphone + glassmorphism */
    body {
      background:
        radial-gradient(circle at 15% 10%, rgba(16,185,129,.18), transparent 30%),
        radial-gradient(circle at 90% 20%, rgba(6,182,212,.12), transparent 28%),
        linear-gradient(135deg, #eefbf7 0%, #f7fafc 50%, #eef7f5 100%);
    }
    .header {
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.65);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 12px 35px rgba(15,23,42,.06);
      border-radius: 0 0 24px 24px;
    }
    .card {
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 16px 45px rgba(15,23,42,.08);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
    }
    .upload-zone { background: rgba(236,253,245,.58); border-color: rgba(16,185,129,.65); border-radius: 18px; }
    input, select, .preview-area {
      background: rgba(255,255,255,.58);
      border-color: rgba(16,185,129,.35);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .phone-badge { background: rgba(236,253,245,.62); border-radius: 999px; }

    @media (max-width: 600px) {
      body { padding: 12px; line-height: 1.45; }
      .header { margin: -12px -12px 18px; padding: 30px 16px 24px; border-radius: 0 0 22px 22px; }
      .header .logo { font-size: 10px; letter-spacing: 2.5px; margin-bottom: 9px; }
      .header h1 { font-size: 2rem; margin-bottom: 12px; }
      .main-grid { display: flex; flex-direction: column; gap: 14px; }
      .card { width: 100%; padding: 18px; border-radius: 20px; }
      .card-title { font-size: 10px; letter-spacing: 1.5px; margin-bottom: 16px; }
      .upload-zone { padding: 38px 14px; margin-bottom: 22px; }
      .upload-zone-text { font-size: 14px; }
      .upload-zone-hint { font-size: 11px; }
      .form-grid { grid-template-columns: 1fr; gap: 13px; margin-bottom: 18px; }
      .full-width { grid-column: auto; }
      .form-label { font-size: 10px; margin-bottom: 5px; }
      input, select { width: 100%; min-height: 46px; font-size: 16px; border-radius: 12px; padding: 11px 12px; }
      .display-value { padding: 10px 12px; min-height: 46px; display: flex; align-items: center; background: rgba(236,253,245,.55); border-radius: 12px; border: 1px solid rgba(16,185,129,.25); }
      .button-group { flex-direction: column; gap: 10px; margin-top: 20px; }
      button { width: 100%; min-height: 48px; border-radius: 13px; font-size: 12px; touch-action: manipulation; }
      .preview-area { height: 330px; padding: 15px; font-size: 12px; border-radius: 14px; overflow-wrap: anywhere; }
      .modal { padding: 20px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="logo">Abhishek Rasal's</span>
    <h1>Tax Invoice Extractor</h1>
    <div class="divider"></div>
  </div>

  <div class="main-grid">
    <div class="card">
      <span class="card-title">01. Source File</span>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-zone-text">📄 DROP INVOICE HERE</div>
        <div class="upload-zone-hint">PDF Files Only • Auto-Extraction Enabled</div>
        <input type="file" id="pdfFile" accept="application/pdf" style="display: none;" />
      </div>

      <span class="card-title">02. Data Review</span>
      <div class="form-grid">
        <div class="form-group full-width">
          <label class="form-label">Redemption Link</label>
          <input type="text" id="redemptionLink" value="https://www.redeemnow.in/hpbtcnote2026" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Partner State</label>
          <input type="text" id="partnerState" disabled />
        </div>
        <div class="form-group">
          <label class="form-label">Partner Name</label>
          <input type="text" id="partnerName" disabled />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="category" onchange="updatePreview()">
            <option value="Everyone">Everyone</option>
            <option value="Student">Student</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Purchase Date</label>
          <input type="date" id="purchaseDate" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Invoice Number</label>
          <input type="text" id="invoiceNumber" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Purchase Amount</label>
          <input type="number" id="purchaseAmount" step="0.01" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Serial Number</label>
          <input type="text" id="serialNumber" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Part Code</label>
          <input type="text" id="partCode" oninput="updatePreview()" />
        </div>
        <div class="form-group full-width">
          <label class="form-label">Receiver Phone</label>
          <div class="display-value" id="billMobileNumberDisplay">—</div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="saveExtractedData()">Save Changes</button>
        <button class="btn-secondary" onclick="clearForm()">Reset Form</button>
      </div>
    </div>

    <div class="card">
      <span class="card-title">03. Message Preview</span>
      <div class="phone-badge" id="detectedPhoneDisplay">📱 Waiting for PDF...</div>
      <div class="preview-area" id="messagePreview">Complete the extraction to generate message...</div>
      <div class="button-group">
        <button class="btn-primary" onclick="sendWhatsApp()">Send On WhatsApp</button>
        <button class="btn-secondary" onclick="copyToClipboard()">Copy Text</button>
      </div>
    </div>
  </div>
</div>

<div id="processingModal" class="modal">
  <div class="spinner"></div>
  <div style="color: white; font-weight: 600;">Processing Invoice Data...</div>
</div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const storage = {
    currentInvoice: JSON.parse(localStorage.getItem('currentInvoice')) || null
  };

  const uploadZone = document.getElementById('uploadZone');
  const pdfFile = document.getElementById('pdfFile');

  uploadZone.addEventListener('click', () => pdfFile.click());

  ['dragenter', 'dragover'].forEach(e =>
    uploadZone.addEventListener(e, ev => {
      ev.preventDefault();
      ev.stopPropagation();
      uploadZone.classList.add('dragover');
    })
  );

  ['dragleave', 'drop'].forEach(e =>
    uploadZone.addEventListener(e, ev => {
      ev.preventDefault();
      ev.stopPropagation();
      uploadZone.classList.remove('dragover');
    })
  );

  uploadZone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) handlePdfUpload(file);
  });

  pdfFile.addEventListener('change', e => {
    if (e.target.files[0]) handlePdfUpload(e.target.files[0]);
  });

  async function handlePdfUpload(file) {
    if (!file || file.type !== 'application/pdf') return;

    document.getElementById('processingModal').classList.add('active');

    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument(buf).promise;

      let rawItems = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        rawItems = rawItems.concat(content.items);
      }

      const fullText = rawItems.map(it => it.str).join(' ');
      const rejoined = rejoinPartCodeTokens(rawItems);
      const extracted = extractInvoiceFields(fullText, rejoined);

      storage.currentInvoice = extracted;
      localStorage.setItem('currentInvoice', JSON.stringify(extracted));
      populateForm(extracted);
      updatePreview();
    } catch (err) {
      console.error(err);
    } finally {
      document.getElementById('processingModal').classList.remove('active');
    }
  }

  function rejoinPartCodeTokens(items) {
    const strs = items.map(it => it.str);
    const out = [];
    let i = 0;

    while (i < strs.length) {
      const tok = strs[i];

      if (tok.match(/#$/) && i + 1 < strs.length) {
        out.push(tok + strs[i + 1]);
        i += 2;
        continue;
      }

      if (tok.includes('#') && i + 1 < strs.length) {
        const next = strs[i + 1].trim();
        if (/^[A-Z]{1,4}$/i.test(next)) {
          out.push(tok + next);
          i += 2;
          continue;
        }
      }

      out.push(tok);
      i++;
    }

    return out.join(' ');
  }

  function extractInvoiceFields(text, rejoined) {
    text = text.replace(/\s+/g, ' ').trim();
    rejoined = rejoined.replace(/\s+/g, ' ').trim();

    const data = {
      partnerState: 'Maharashtra',
      partnerName: 'Geonet It Mall Private Limited - Indira Chambers, Pune',
      category: 'Everyone',
      purchaseDate: '',
      purchaseAmount: '',
      serialNumber: '',
      invoiceNumber: '',
      partCode: '',
      billMobileNumber: '',
      redemptionLink: document.getElementById('redemptionLink').value.trim()
    };

    const invM = text.match(/Invoice No\s*:\s*([A-Z0-9\-\/]+)/i);
    if (invM) data.invoiceNumber = invM[1].trim();

    const dateM = text.match(/Invoice Date\s*:\s*(\d{2}-\d{2}-\d{4})/i);
    if (dateM) {
      const [d, m, y] = dateM[1].split('-');
      data.purchaseDate = `${y}-${m}-${d}`;
    }

    const amtM = text.match(/Total Amount\s*:\s*([\d,]+(?:\.\d{1,2})?)/i);
    if (amtM) data.purchaseAmount = amtM[1].replace(/,/g, '').trim();

    /* PART CODE */
    const pcM =
      rejoined.match(/SR\.?\s*No\.?\s*1\s+([A-Z0-9]{4,20})#[A-Z]{1,5}/i) ||
      rejoined.match(/\b([A-Z0-9]{4,20})#[A-Z]{1,5}\b/i);
    if (pcM) data.partCode = pcM[1].toUpperCase();

    /* SERIAL NUMBER FIX
       Rule:
       - under SR. NO. 1 row
       - in Name of Product/Service
       - after model suffix TU, AU, QU, TX, AX
       Example:
       1 C9LZ5PA#ACJ HP 15-fd1444TU 5CD5377NJT , 84713010
    */
    const suffixes = '(?:TU|AU|QU|TX|AX|LU|HU|SX|NX|WU|SU|XU|NU)';
    const serialPatterns = [
      new RegExp(`SR\\.?\\s*No\\.?\\s*1[\\s\\S]{0,250}?HP\\s+[\\w\\-\\/]*${suffixes}\\s+([A-Z0-9]{10})(?=\\s*,|\\s+\\d{6,})`, 'i'),
      new RegExp(`HP\\s+[\\w\\-\\/]*${suffixes}\\s+([A-Z0-9]{10})(?=\\s*,|\\s+\\d{6,})`, 'i'),
      new RegExp(`${suffixes}\\s+([A-Z0-9]{10})(?=\\s*,|\\s+\\d{6,})`, 'i')
    ];

    for (const pattern of serialPatterns) {
      const m = rejoined.match(pattern) || text.match(pattern);
      if (m && isValidSerial(m[1])) {
        data.serialNumber = m[1].toUpperCase();
        break;
      }
    }

    if (!data.serialNumber) {
      const allTokens = [...rejoined.matchAll(/\b([A-Z0-9]{10})\b/gi)];
      for (const m of allTokens) {
        const token = m[1].toUpperCase();
        const letters = (token.match(/[A-Z]/g) || []).length;
        const digits = (token.match(/[0-9]/g) || []).length;
        if (letters >= 3 && digits >= 3) {
          data.serialNumber = token;
          break;
        }
      }
    }

    /* RECEIVER MOBILE NUMBER
       Extract only from the Details of Receiver / Billed to block.
       Never use the store/seller number as a fallback.
    */
    let foundPhone = '';
    const receiverAnchor = /Details of Receiver\s*\|\s*Billed to/i.exec(text);
    if (receiverAnchor) {
      const sectionStart = receiverAnchor.index + receiverAnchor[0].length;
      const rest = text.slice(sectionStart);
      // PDF.js may put the receiver and consignee headings together, while
      // the receiver fields (including its phone) follow on later tokens.
      // Use the second Name field as the receiver-block boundary.
      const nameMatches = [...rest.matchAll(/\bName\s*:/gi)];
      const receiverEnd = nameMatches.length > 1 ? nameMatches[1].index : -1;
      const section = receiverEnd >= 0 ? rest.slice(0, receiverEnd) : rest.slice(0, 1600);

      const phoneLabel = /Phone\s*No\.?\s*:?\s*/i.exec(section);
      if (phoneLabel) {
        const afterLabel = section.slice(phoneLabel.index + phoneLabel[0].length);
        const m = afterLabel.match(/\b([6-9]\d{9})\b/);
        if (m) foundPhone = m[1];
      }
      if (!foundPhone) {
        const receiverPhones = section.match(/\b[6-9]\d{9}\b/g) || [];
        foundPhone = receiverPhones[0] || '';
      }
    }

    // The seller/store number (e.g. 7774851338) is outside the receiver block.
    // Do not use document-wide phone fallbacks because they can select it.
    data.billMobileNumber = (foundPhone && foundPhone !== '7774851338') ? '91' + foundPhone : '';

    return data;
  }

  function isValidSerial(s) {
    const u = s.toUpperCase();
    return /^[A-Z0-9]{10}$/.test(u) && /[A-Z]/.test(u) && /[0-9]/.test(u);
  }

  function populateForm(d) {
    document.getElementById('partnerState').value = d.partnerState || '';
    document.getElementById('partnerName').value = d.partnerName || '';
    document.getElementById('category').value = d.category || 'Everyone';
    document.getElementById('purchaseDate').value = d.purchaseDate || '';
    document.getElementById('purchaseAmount').value = d.purchaseAmount || '';
    document.getElementById('serialNumber').value = d.serialNumber || '';
    document.getElementById('invoiceNumber').value = d.invoiceNumber || '';
    document.getElementById('partCode').value = d.partCode || '';

    document.getElementById('billMobileNumberDisplay').textContent =
      d.billMobileNumber ? '📱 ' + d.billMobileNumber : '—';

    document.getElementById('detectedPhoneDisplay').textContent =
      d.billMobileNumber ? '📱 ' + d.billMobileNumber : '📱 Waiting for PDF...';
  }

  function formatDate(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-');
    const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d}-${mn[parseInt(m,10)-1]}-${y}`;
  }

  function buildWhatsAppMessage() {
    const vals = ['redemptionLink', 'partnerState', 'partnerName', 'category', 'purchaseDate', 'purchaseAmount', 'serialNumber', 'invoiceNumber', 'partCode']
      .map(id => document.getElementById(id).value.trim());

    return `${vals[0]}

Please Fill Following Details On Site Under 14 Days From Purchase Date.

Select Student Category Only When Bill Name Person Have Student ID Of Current Year Mentioned On ID.

Upload GST Certificate As Identity Proof When Tax Invoice On Firm Name.

Partner State: ${vals[1]}
Partner Name: ${vals[2]}
Category: ${vals[3]}
Purchase Date: ${formatDate(vals[4])}
Purchase Amount: ${vals[5]}
Product Serial Number: ${vals[6]}
Invoice Number: ${vals[7]}
Product Part Code: ${vals[8]}
SKU: It Will Be Taken Automatically When Product Part Code Is Selected.`;
  }

  function updatePreview() {
    document.getElementById('messagePreview').textContent = buildWhatsAppMessage();
  }

  function saveExtractedData() {
    storage.currentInvoice = {
      ...storage.currentInvoice,
      partnerState: document.getElementById('partnerState').value.trim(),
      partnerName: document.getElementById('partnerName').value.trim(),
      category: document.getElementById('category').value.trim(),
      purchaseDate: document.getElementById('purchaseDate').value,
      purchaseAmount: document.getElementById('purchaseAmount').value.trim(),
      serialNumber: document.getElementById('serialNumber').value.trim(),
      invoiceNumber: document.getElementById('invoiceNumber').value.trim(),
      partCode: document.getElementById('partCode').value.trim(),
      redemptionLink: document.getElementById('redemptionLink').value.trim()
    };
    localStorage.setItem('currentInvoice', JSON.stringify(storage.currentInvoice));
    updatePreview();
  }

  function clearForm() {
    ['partnerState','partnerName','purchaseDate','purchaseAmount','serialNumber','invoiceNumber','partCode'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('category').value = 'Everyone';
    document.getElementById('billMobileNumberDisplay').textContent = '—';
    document.getElementById('detectedPhoneDisplay').textContent = '📱 Waiting for PDF...';
    document.getElementById('messagePreview').textContent = 'Complete the extraction to generate message...';
    storage.currentInvoice = null;
    localStorage.removeItem('currentInvoice');
    pdfFile.value = '';
  }

  function copyToClipboard() {
    navigator.clipboard.writeText(buildWhatsAppMessage());
  }

  function sendWhatsApp() {
    const p = (storage.currentInvoice?.billMobileNumber || '').trim();
    if (!p) return;
    window.open(`https://wa.me/${p}?text=${encodeURIComponent(buildWhatsAppMessage())}`, '_blank');
  }

  window.addEventListener('load', () => {
    if (storage.currentInvoice) {
      populateForm(storage.currentInvoice);
      updatePreview();
    }
  });
</script>
</body>
</html>
