<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tax Invoice Extractor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,600&family=Inter:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --em: #10b981;
      --em-light: #d1fae5;
      --em-bg: rgba(16, 185, 129, 0.08);
      --glass: rgba(255, 255, 255, 0.62);
      --glass-border: rgba(255, 255, 255, 0.72);
      --blur: blur(14px);
      --shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
      --radius: 16px;
      --transition: all 0.2s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f9fafb;
      color: #111827;
      min-height: 100vh;
      padding: 0 16px 40px;
      line-height: 1.5;
      position: relative;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    .header {
      text-align: center;
      margin: -40px -16px 32px;
      padding: 50px 24px 44px;
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }
    .header .logo {
      font-family: 'Playfair Display', serif;
      font-size: clamp(0.85rem, 1.5vw, 1rem);
      letter-spacing: 2px;
      color: rgba(16, 185, 129, 0.7);
      text-transform: uppercase;
      margin-bottom: 14px;
      font-weight: 500;
      font-style: normal;
      opacity: 0.9;
    }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.4rem);
      font-weight: 700;
      color: var(--em);
      letter-spacing: -1px;
      margin-bottom: 18px;
      line-height: 1.15;
    }
    .header .divider {
      width: 80px;
      height: 2px;
      margin: 0 auto;
      background: linear-gradient(90deg, transparent, var(--em), transparent);
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      gap: 24px;
    }

    .card {
      background: var(--glass);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      transition: var(--transition);
    }
    .card:hover {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
      transform: translateY(-2px);
    }

    .section-label {
      font-family: 'Sora', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--em);
      text-transform: uppercase;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-label::before {
      content: '';
      width: 20px;
      height: 2px;
      background: var(--em);
      border-radius: 1px;
    }

    .upload-zone {
      border: 2px dashed var(--em);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 24px;
      background: var(--em-bg);
    }
    .upload-zone:hover, .upload-zone.dragover {
      background: rgba(16, 185, 129, 0.13);
      border-color: var(--em);
      transform: scale(1.01);
    }
    .upload-zone-text {
      font-size: 15px;
      font-weight: 600;
      color: var(--em);
      margin-bottom: 6px;
    }
    .upload-zone-hint {
      font-size: 12px;
      color: #6b7280;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }
    .form-group { display: flex; flex-direction: column; }
    .full-width { grid-column: 1 / -1; }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-family: 'Sora', sans-serif;
    }

    input, select {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      color: #111827;
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 11px 14px;
      outline: none;
      transition: var(--transition);
    }
    input:focus, select:focus {
      border-color: var(--em);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
      background: rgba(255, 255, 255, 0.76);
    }
    input:disabled {
      background: #f3f4f6;
      border-color: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    .display-value {
      font-size: 14px;
      font-weight: 600;
      color: var(--em);
      padding: 11px 14px;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.18);
      border-radius: 10px;
      min-height: 44px;
      display: flex;
      align-items: center;
    }
    .display-value.empty {
      color: #9ca3af;
      font-weight: 400;
    }

    .phone-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--em-bg);
      border: 1px solid rgba(16, 185, 129, 0.24);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--em);
      margin-bottom: 16px;
    }
    .phone-badge.active {
      background: rgba(16, 185, 129, 0.16);
      border-color: var(--em);
    }

    .preview-area {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      line-height: 1.7;
      color: #374151;
      background: rgba(255, 255, 255, 0.36);
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 20px;
      height: 380px;
      overflow-y: auto;
      white-space: pre-wrap;
      margin-bottom: 20px;
    }
    .preview-area::-webkit-scrollbar { width: 6px; }
    .preview-area::-webkit-scrollbar-thumb {
      background: rgba(16, 185, 129, 0.3);
      border-radius: 3px;
    }
    .preview-area .placeholder-text {
      color: #9ca3af;
      font-style: italic;
    }

    .button-group {
      display: flex;
      gap: 12px;
    }
    button {
      flex: 1;
      font-family: 'Sora', sans-serif;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 12px 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }
    .btn-primary {
      background: var(--em);
      color: white;
    }
    .btn-primary:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }
    .btn-secondary {
      background: white;
      color: var(--em);
      border: 1px solid var(--em);
    }
    .btn-secondary:hover {
      background: var(--em-light);
    }
    .btn-whatsapp {
      background: var(--em);
      color: white;
    }
    .btn-whatsapp:hover {
      background: #059669;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 32px;
      text-align: center;
      box-shadow: var(--shadow);
      backdrop-filter: var(--blur);
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal.active .modal-content {
      transform: translateY(0);
      opacity: 1;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(16, 185, 129, 0.2);
      border-top-color: var(--em);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-text { font-weight: 600; color: #111827; }

    .toast {
      position: fixed;
      top: 24px;
      right: 24px;
      background: var(--glass);
      backdrop-filter: var(--blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
      z-index: 2000;
      min-width: 200px;
      opacity: 0;
    }
    .toast.show {
      transform: translateX(0);
      opacity: 1;
    }
    .toast-content {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #111827;
    }
    .toast-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      flex-shrink: 0;
    }
    .toast-success .toast-icon {
      background: rgba(16, 185, 129, 0.2);
      color: var(--em);
    }
    .toast-error .toast-icon {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }
    .toast-info .toast-icon {
      background: rgba(37, 211, 102, 0.2);
      color: #25d366;
    }
    .toast-message {
      font-size: 13px;
      font-weight: 500;
      flex: 1;
    }

    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
      .card { padding: 20px; }
      .toast {
        top: 16px;
        right: 16px;
        left: 16px;
        width: auto;
      }
    }
    @media (max-width: 600px) {
      body { padding: 0 12px 32px; }
      .header { margin: -12px -12px 20px; padding: 32px 16px 28px; }
      .header .logo { font-size: 0.85rem; margin-bottom: 10px; }
      .header h1 { font-size: 1.9rem; margin-bottom: 14px; }
      .main-grid { gap: 16px; }
      .card { padding: 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 12px; }
      .full-width { grid-column: auto; }
      .upload-zone { padding: 32px 16px; }
      .preview-area { height: 300px; }
      .button-group { flex-direction: column; gap: 8px; }
      button { width: 100%; }
      .modal-content { padding: 24px; margin: 16px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <span class="logo">Abhishek Rasal's</span>
    <h1>Tax Invoice Extractor</h1>
    <div class="divider"></div>
  </div>

  <div class="main-grid">
    <div class="card">
      <div class="section-label">01. Source File</div>
      <div class="upload-zone" id="uploadZone">
        <div class="upload-zone-text">📄 DROP INVOICE HERE</div>
        <div class="upload-zone-hint">PDF Files Only • Auto-Extraction Enabled</div>
        <input type="file" id="pdfFile" accept="application/pdf" style="display: none;" />
      </div>

      <div class="section-label">02. Data Review</div>
      <div class="form-grid">
        <div class="form-group full-width">
          <label class="form-label">Redemption Link</label>
          <input type="text" id="redemptionLink" value="https://www.redeemnow.in/prefestive2026" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Partner State</label>
          <input type="text" id="partnerState" disabled />
        </div>
        <div class="form-group">
          <label class="form-label">Partner Name</label>
          <input type="text" id="partnerName" disabled />
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="category" onchange="updatePreview()">
            <option value="Everyone">Everyone</option>
            <option value="Student">Student</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Purchase Date</label>
          <input type="date" id="purchaseDate" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Invoice Number</label>
          <input type="text" id="invoiceNumber" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Purchase Amount</label>
          <input type="number" id="purchaseAmount" step="0.01" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Serial Number</label>
          <input type="text" id="serialNumber" oninput="updatePreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">Part Code</label>
          <input type="text" id="partCode" oninput="updatePreview()" />
        </div>
        <div class="form-group full-width">
          <label class="form-label">Receiver Phone</label>
          <div class="display-value empty" id="billMobileNumberDisplay">—</div>
        </div>
      </div>

      <div class="button-group">
        <button class="btn-primary" onclick="saveExtractedData()">Save Changes</button>
        <button class="btn-secondary" onclick="clearForm()">Reset Form</button>
      </div>
    </div>

    <div class="card">
      <div class="section-label">03. Message Preview</div>
      <div class="phone-badge" id="detectedPhoneDisplay">📱 Waiting for PDF...</div>
      <div class="preview-area" id="messagePreview">
        <span class="placeholder-text">Complete the extraction to generate message...</span>
      </div>
      <div class="button-group">
        <button class="btn-whatsapp" onclick="sendWhatsApp()">Send On WhatsApp</button>
        <button class="btn-secondary" onclick="copyToClipboard()">Copy Text</button>
      </div>
    </div>
  </div>
</div>

<div id="processingModal" class="modal">
  <div class="modal-content">
    <div class="spinner"></div>
    <div class="modal-text">Processing Invoice Data...</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const storage = { currentInvoice: JSON.parse(localStorage.getItem('currentInvoice')) || null };
  const uploadZone = document.getElementById('uploadZone');
  const pdfFile = document.getElementById('pdfFile');

  uploadZone.addEventListener('click', () => pdfFile.click());
  ['dragenter', 'dragover'].forEach(e => uploadZone.addEventListener(e, ev => {
    ev.preventDefault(); ev.stopPropagation(); uploadZone.classList.add('dragover');
  }));
  ['dragleave', 'drop'].forEach(e => uploadZone.addEventListener(e, ev => {
    ev.preventDefault(); ev.stopPropagation(); uploadZone.classList.remove('dragover');
  }));
  uploadZone.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) handlePdfUpload(file);
  });
  pdfFile.addEventListener('change', e => {
    if (e.target.files[0]) handlePdfUpload(e.target.files[0]);
  });

  let toastTimeout;
  function showToast(message, type = 'success') {
    const toast = document.getElementById('toast');
    toast.className = `toast toast-${type} show`;
    toast.innerHTML = `
      <div class="toast-content">
        <div class="toast-icon">${getToastIcon(type)}</div>
        <div class="toast-message">${message}</div>
      </div>
    `;
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
  }

  function getToastIcon(type) {
    switch(type) {
      case 'success': return '✓';
      case 'error': return '✗';
      case 'info': return 'ℹ';
      default: return 'ℹ';
    }
  }

  async function handlePdfUpload(file) {
    if (!file || file.type !== 'application/pdf') {
      showToast('Please upload a valid PDF file.', 'error');
      return;
    }

    document.getElementById('processingModal').classList.add('active');

    try {
      const buf = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument(buf).promise;

      let rawItems = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        rawItems.push(...content.items);
      }

      const fullText = rawItems.map(it => it.str).join(' ');
      const rejoined = rejoinPartCodeTokens(rawItems);
      const extracted = extractInvoiceFields(fullText, rejoined);

      storage.currentInvoice = extracted;
      localStorage.setItem('currentInvoice', JSON.stringify(extracted));
      populateForm(extracted);
      updatePreview();
      // Extraction notification removed as per user request
    } catch (err) {
      console.error('PDF processing error:', err);
      showToast('Failed to process PDF', 'error');
    } finally {
      document.getElementById('processingModal').classList.remove('active');
    }
  }

  function rejoinPartCodeTokens(items) {
    const strs = items.map(it => it.str);
    const out = [];
    let i = 0;
    while (i < strs.length) {
      const tok = strs[i];
      if (tok.match(/#$/) && i + 1 < strs.length) {
        out.push(tok + strs[i + 1]);
        i += 2;
        continue;
      }
      if (tok.includes('#') && i + 1 < strs.length) {
        const next = strs[i + 1].trim();
        if (/^[A-Z]{1,4}$/i.test(next)) {
          out.push(tok + next);
          i += 2;
          continue;
        }
      }
      out.push(tok);
      i++;
    }
    return out.join(' ');
  }

  function extractInvoiceFields(text, rejoined) {
    text = text.replace(/\s+/g, ' ').trim();
    rejoined = rejoined.replace(/\s+/g, ' ').trim();

    const data = {
      partnerState: 'Maharashtra',
      partnerName: 'Geonet It Mall Private Limited - Indira Chambers, Pune',
      category: 'Everyone',
      purchaseDate: '',
      purchaseAmount: '',
      serialNumber: '',
      invoiceNumber: '',
      partCode: '',
      billMobileNumber: '',
      redemptionLink: document.getElementById('redemptionLink').value.trim()
    };

    const invM = text.match(/Invoice No\s*:\s*([A-Z0-9\-\/]+)/i);
    if (invM) data.invoiceNumber = invM[1].trim();

    const dateM = text.match(/Invoice Date\s*:\s*(\d{2}-\d{2}-\d{4})/i);
    if (dateM) {
      const [d, m, y] = dateM[1].split('-');
      data.purchaseDate = `${y}-${m}-${d}`;
    }

    const amtM = text.match(/Total Amount\s*:\s*([\d,]+(?:\.\d{1,2})?)/i);
    if (amtM) data.purchaseAmount = amtM[1].replace(/,/g, '').trim();

    const pcM = rejoined.match(/SR\.?\s*No\.?\s*1\s+([A-Z0-9]{4,20})#[A-Z]{1,5}/i) ||
               rejoined.match(/\b([A-Z0-9]{4,20})#[A-Z]{1,5}\b/i);
    if (pcM) data.partCode = pcM[1].toUpperCase();

    const suffixes = '(?:TU|AU|QU|TX|AX|LU|HU|SX|NX|WU|SU|XU|NU)';
    const serialPatterns = [
      new RegExp(`SR\\.?\\s*No\\.?\\s*1[\\s\\S]{0,250}?HP\\s+[\\w\\-\\/]*${suffixes}\\s+([A-Z0-9]{10})(?=\\s*,|\\s+\\d{6,})`, 'i'),
      new RegExp(`HP\\s+[\\w\\-\\/]*${suffixes}\\s+([A-Z0-9]{10})(?=\\s*,|\\s+\\d{6,})`, 'i'),
      new RegExp(`${suffixes}\\s+([A-Z0-9]{10})(?=\\s*,|\\s+\\d{6,})`, 'i')
    ];

    for (const pattern of serialPatterns) {
      const m = rejoined.match(pattern) || text.match(pattern);
      if (m && isValidSerial(m[1])) {
        data.serialNumber = m[1].toUpperCase();
        break;
      }
    }

    if (!data.serialNumber) {
      const allTokens = [...rejoined.matchAll(/\b([A-Z0-9]{10})\b/gi)];
      for (const m of allTokens) {
        const token = m[1].toUpperCase();
        const letters = (token.match(/[A-Z]/g) || []).length;
        const digits = (token.match(/[0-9]/g) || []).length;
        if (letters >= 3 && digits >= 3) {
          data.serialNumber = token;
          break;
        }
      }
    }

    let foundPhone = '';
    const receiverAnchor = /Details of Receiver\s*\|\s*Billed to/i.exec(text);
    if (receiverAnchor) {
      const sectionStart = receiverAnchor.index + receiverAnchor[0].length;
      const rest = text.slice(sectionStart);
      const nameMatches = [...rest.matchAll(/\bName\s*:/gi)];
      const receiverEnd = nameMatches.length > 1 ? nameMatches[1].index : -1;
      const section = receiverEnd >= 0 ? rest.slice(0, receiverEnd) : rest.slice(0, 1600);

      const phoneLabel = /Phone\s*No\.?\s*:?\s*/i.exec(section);
      if (phoneLabel) {
        const afterLabel = section.slice(phoneLabel.index + phoneLabel[0].length);
        const m = afterLabel.match(/\b([6-9]\d{9})\b/);
        if (m) foundPhone = m[1];
      }
      if (!foundPhone) {
        const receiverPhones = section.match(/\b[6-9]\d{9}\b/g) || [];
        foundPhone = receiverPhones[0] || '';
      }
    }

    data.billMobileNumber = (foundPhone && foundPhone !== '7774851338') ? '91' + foundPhone : '';

    return data;
  }

  function isValidSerial(s) {
    const u = s.toUpperCase();
    return /^[A-Z0-9]{10}$/.test(u) && /[A-Z]/.test(u) && /[0-9]/.test(u);
  }

  function populateForm(d) {
    document.getElementById('partnerState').value = d.partnerState || '';
    document.getElementById('partnerName').value = d.partnerName || '';
    document.getElementById('category').value = d.category || 'Everyone';
    document.getElementById('purchaseDate').value = d.purchaseDate || '';
    document.getElementById('purchaseAmount').value = d.purchaseAmount || '';
    document.getElementById('serialNumber').value = d.serialNumber || '';
    document.getElementById('invoiceNumber').value = d.invoiceNumber || '';
    document.getElementById('partCode').value = d.partCode || '';

    document.getElementById('billMobileNumberDisplay').textContent =
      d.billMobileNumber ? '📱 ' + d.billMobileNumber : '—';
    document.getElementById('billMobileNumberDisplay').classList.toggle('empty', !d.billMobileNumber);

    document.getElementById('detectedPhoneDisplay').textContent =
      d.billMobileNumber ? '📱 ' + d.billMobileNumber : '📱 Waiting for PDF...';
    document.getElementById('detectedPhoneDisplay').classList.toggle('active', !!d.billMobileNumber);
  }

  function formatDate(s) {
    if (!s) return '';
    const [y, m, d] = s.split('-');
    const mn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${d}-${mn[parseInt(m,10)-1]}-${y}`;
  }

  function buildWhatsAppMessage() {
    const vals = ['redemptionLink', 'partnerState', 'partnerName', 'category', 'purchaseDate', 'purchaseAmount', 'serialNumber', 'invoiceNumber', 'partCode']
      .map(id => document.getElementById(id).value.trim());

    return `${vals[0]}

Please Fill Following Details On Site Under 14 Days From Purchase Date.

Select Student Category Only When Bill Name Person Have Student ID Of Current Year Mentioned On ID.

Upload GST Certificate As Identity Proof When Tax Invoice On Firm Name.

Partner State: ${vals[1]}
Partner Name: ${vals[2]}
Category: ${vals[3]}
Purchase Date: ${formatDate(vals[4])}
Purchase Amount: ${vals[5]}
Product Serial Number: ${vals[6]}
Invoice Number: ${vals[7]}
Product Part Code: ${vals[8]}
SKU: It Will Be Taken Automatically When Product Part Code Is Selected.

Note: Fill Name Fields As Per Tax Invoice.`;
  }

  function updatePreview() {
    const hasContent = ['redemptionLink', 'partnerState', 'partnerName', 'category', 'purchaseDate', 'purchaseAmount', 'serialNumber', 'invoiceNumber', 'partCode']
      .some(id => document.getElementById(id).value.trim());
    document.getElementById('messagePreview').textContent = hasContent ? buildWhatsAppMessage() :
      'Complete the extraction to generate message...';
  }

  function saveExtractedData() {
    storage.currentInvoice = {
      ...storage.currentInvoice,
      partnerState: document.getElementById('partnerState').value.trim(),
      partnerName: document.getElementById('partnerName').value.trim(),
      category: document.getElementById('category').value.trim(),
      purchaseDate: document.getElementById('purchaseDate').value,
      purchaseAmount: document.getElementById('purchaseAmount').value.trim(),
      serialNumber: document.getElementById('serialNumber').value.trim(),
      invoiceNumber: document.getElementById('invoiceNumber').value.trim(),
      partCode: document.getElementById('partCode').value.trim(),
      redemptionLink: document.getElementById('redemptionLink').value.trim()
    };
    localStorage.setItem('currentInvoice', JSON.stringify(storage.currentInvoice));
    updatePreview();
    showToast('Changes saved successfully', 'success');
  }

  function clearForm() {
    ['partnerState','partnerName','purchaseDate','purchaseAmount','serialNumber','invoiceNumber','partCode'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('category').value = 'Everyone';
    document.getElementById('billMobileNumberDisplay').textContent = '—';
    document.getElementById('billMobileNumberDisplay').classList.add('empty');
    document.getElementById('detectedPhoneDisplay').textContent = '📱 Waiting for PDF...';
    document.getElementById('detectedPhoneDisplay').classList.remove('active');
    document.getElementById('messagePreview').textContent = 'Complete the extraction to generate message...';
    storage.currentInvoice = null;
    localStorage.removeItem('currentInvoice');
    pdfFile.value = '';
    showToast('Form reset', 'info');
  }

  function copyToClipboard() {
    navigator.clipboard.writeText(buildWhatsAppMessage());
    showToast('Copied to clipboard', 'success');
  }

  function sendWhatsApp() {
    const p = (storage.currentInvoice?.billMobileNumber || '').trim();
    if (!p) {
      showToast('No phone number found in invoice', 'error');
      return;
    }
    window.open(`https://wa.me/${p}?text=${encodeURIComponent(buildWhatsAppMessage())}`, '_blank');
  }

  window.addEventListener('load', () => {
    if (storage.currentInvoice) {
      populateForm(storage.currentInvoice);
      updatePreview();
    }
  });
</script>
</body>
</html>
